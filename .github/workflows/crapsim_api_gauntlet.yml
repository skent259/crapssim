name: CrapsSim Engine API Gauntlet

on:
  workflow_dispatch:
  push:
    branches:
      - "api"
  pull_request:
    branches:
      - "api"

jobs:
  api-gauntlet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ./crapssim_api[tests,gauntlet]
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"

      - name: Ensure results directories exist
        run: |
          mkdir -p crapssim_api/tests/stress/results
          mkdir -p crapssim_api/tests/replay/results

      - name: Run API surface stress suite
        run: |
          pytest -q crapssim_api/tests/stress/test_api_sequences.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run API sequence trace suite
        run: |
          pytest -q crapssim_api/tests/stress/test_vanilla_sequences.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run API surface parity suite
        run: |
          pytest -q crapssim_api/tests/stress/test_sequence_parity.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload API gauntlet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crapsim-api-gauntlet-${{ github.sha }}-${{ matrix.python-version }}
          path: |
            crapssim_api/tests/stress/results/*
            crapssim_api/tests/replay/results/*
