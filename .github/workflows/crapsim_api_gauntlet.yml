name: CrapsSim Engine API Gauntlet

on:
  workflow_dispatch:

jobs:
  api-gauntlet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Engine + API extras
        run: |
          python -m pip install --upgrade pip
          pip install .[api]

      - name: Run API sequence gauntlet
        run: |
          PYTHONPATH=. pytest -q crapssim_api/tests/stress/test_api_sequences.py

      - name: Archive gauntlet artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crapsim-api-gauntlet-${{ github.sha }}
          path: |
            crapssim_api/tests/stress/output/**
            API_SEQUENCE_TRACE_*.md
            *_sequences_journal.json
          if-no-files-found: ignore
