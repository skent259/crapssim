name: CrapsSim Engine API CI

on:
  push:
    paths:
      - "crapssim_api/**"
      - ".github/workflows/api-engine-ci.yml"
  pull_request:
    paths:
      - "crapssim_api/**"
      - ".github/workflows/api-engine-ci.yml"
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (engine + API)
        run: |
          python -m pip install --upgrade pip
          pip install .[api]

      - name: Run API unit tests
        run: |
          PYTHONPATH=. pytest -q crapssim_api/tests

      - name: Run API sequence/gauntlet stress tests (short)
        run: |
          PYTHONPATH=. pytest -q crapssim_api/tests/stress/test_api_sequences.py

  import-sanity:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Import sanity check
        run: |
          python - << 'EOF'
          import crapssim
          # Engine API should be importable at top-level, but HTTP layer must fail gracefully
          import crapssim_api
          try:
              from crapssim_api import http as _http
              # Accessing create_app should either succeed (if extras installed)
              # or raise a clear RuntimeError mentioning "pip install crapssim[api]"
              try:
                  _http.create_app()
              except RuntimeError as exc:
                  msg = str(exc)
                  assert "pip install crapssim[api]" in msg
          except Exception as exc:
              raise SystemExit(f"Import sanity failure: {exc}")
          EOF
