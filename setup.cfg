[metadata]
name = crapssim
version = 0.4.0
author = "Sean Kent, @amortization, @nova-rey"
author_email = skent259@gmail.com
description = Simulator for Craps with various betting strategies
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/skent259/CrapsSim
project_urls =
    Bug Tracker = https://github.com/skent259/CrapsSim/issues
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
install_requires =
    numpy >= 1.18.0
python_requires = >=3.10

[options.extras_require]
testing =
    pytest
api =
    fastapi>=0.110
    uvicorn>=0.23
    pydantic>=2.0
    httpx>=0.27.0
    typing_extensions>=4.0
